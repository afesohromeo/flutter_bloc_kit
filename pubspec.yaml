name: flutter_bloc_kit
description: A boilerplate for Flutter Projects using BLoC Architecture

publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture
  flutter_bloc: ^9.1.1
  provider: ^6.1.5 # dependency injection only (RepositoryProvider / Provider)
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2

  # Data
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.0.0

  # UI
  app_theme_kit: ^0.1.0
  cupertino_icons: ^1.0.6
  flutter_native_splash: ^2.4.8
  infinite_scroll_pagination: ^4.1.0 # 4.x API: see _standards/13
  intl_phone_field: ^3.2.0
  modal_progress_hud_nsn: ^0.5.1

  # Platform
  intl: any
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  build_runner: ^2.16.1 # 2.16.2+ needs analyzer 14, which flutter_test's pinned test_api blocks (bloc_test)
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  freezed: ^4.0.1 # 4.0.2 needs analyzer 14 (same reason)
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

fluttergen:
  output: lib/src/generated
  line_length: 120

  integrations:
    flutter_svg: true
